<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Annotate</title>
    <script>document.documentElement.dataset.platform = /Macintosh|Mac OS X/.test(navigator.userAgent) ? "mac" : "other";</script>
    <style>
        :root {
            color-scheme: light;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #f6f7f9;
            color: #202833;
        }
        * { box-sizing: border-box; }
        body {
            min-width: 320px;
            min-height: 100vh;
            margin: 0;
            background: #f6f7f9;
            user-select: none;
        }
        button { font: inherit; }
        .window-titlebar { display: none; }
        html[data-platform="mac"] .window-titlebar {
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid #e4e8ed;
            color: #596574;
            font-size: 13px;
            font-weight: 600;
        }
        .window-titlebar span { pointer-events: none; }
        html[data-platform="mac"] .container { height: calc(100vh - 36px); padding-top: 18px; }

        .container {
            width: min(100%, 440px);
            height: 100vh;
            margin: 0 auto;
            padding: 28px 26px 26px;
            display: flex;
            flex-direction: column;
            gap: 18px;
        }
        .status-row {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 19px 20px;
            background: #fff;
            border: 1px solid #e4e8ed;
            border-radius: 15px;
            box-shadow: 0 4px 20px #25354a0a;
        }
        .status-dot {
            width: 9px;
            height: 9px;
            margin-top: 7px;
            border-radius: 50%;
            flex: none;
        }
        .status-dot.running { background: #358368; }
        .status-dot.starting { background: #a17a37; animation: pulse 1.5s ease-in-out infinite; }
        .status-dot.stopped { background: #8d98a5; }
        .status-dot.error { background: #bb5f5f; }
        @keyframes pulse { 50% { opacity: .4; } }
        .status-info { min-width: 0; flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 12px; align-items: center; }
        .status-label { grid-column: 1; font-size: 17px; font-weight: 650; line-height: 1.4; }
        .status-detail { grid-column: 1; margin-top: 4px; color: #6c7785; font-size: 12px; line-height: 1.5; }
        .service-address { grid-column: 2; grid-row: 1 / 3; margin: 0; color: #87919e; font-size: 11px; font-variant-numeric: tabular-nums; white-space: nowrap; }
        .btn-group { display: flex; flex-direction: column; gap: 9px; }
        .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; }
        .btn {
            min-height: 43px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 9px 13px;
            border: 1px solid #dfe4e9;
            border-radius: 10px;
            background: #fff;
            color: #354151;
            font-size: 13px;
            font-weight: 550;
            cursor: pointer;
            transition: background .15s, border-color .15s, color .15s;
        }
        .btn svg { width: 15px; height: 15px; flex: none; }
        .btn:hover:not(:disabled) { background: #eef1f4; border-color: #cfd7df; }
        .btn:focus-visible { outline: 2px solid #687b91; outline-offset: 2px; }
        .btn:disabled { opacity: .45; cursor: default; }
        .btn-primary {
            min-height: 47px;
            border-color: #344455;
            background: #344455;
            color: #fff;
        }
        .btn-primary:hover:not(:disabled) { background: #263544; border-color: #263544; }
        .btn-update { width: 100%; }
        .update-status { min-height: 16px; margin: -9px 0 0; color: #6c7785; font-size: 11px; text-align: center; }
        .log-section { min-height: 0; flex: 1; display: flex; flex-direction: column; }
        .section-title { margin: 0 0 9px; color: #6c7785; font-size: 12px; font-weight: 550; }
        .log-area {
            min-height: 0;
            flex: 1;
            overflow-y: auto;
            padding: 12px 14px;
            border: 1px solid #e4e8ed;
            border-radius: 10px;
            background: #fff;
            color: #647180;
            font: 11px/1.65 'SF Mono', Menlo, Consolas, monospace;
            user-select: text;
        }
        .log-area::-webkit-scrollbar { width: 5px; }
        .log-area::-webkit-scrollbar-thumb { border-radius: 4px; background: #cdd4dc; }
        @media (max-height: 540px) {
            .container { gap: 12px; padding-top: 18px; padding-bottom: 18px; }
            .log-area { min-height: 80px; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; }
        }
    </style>
</head>
<body>
    <div class="window-titlebar" data-tauri-drag-region><span>Annotate</span></div>
    <main class="container">
        <section class="status-row" aria-live="polite" aria-label="服务状态">
            <span class="status-dot starting" id="status-dot"></span>
            <div class="status-info">
                <div class="status-label" id="status-label">正在启动…</div>
                <div class="status-detail" id="status-detail">端口 5008</div>
                <p class="service-address">127.0.0.1:5008</p>
            </div>
        </section>

        <div class="btn-group">
            <button class="btn btn-primary" id="btn-open" onclick="handleOpen()" disabled>
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6M15 3h6v6M10 14L21 3"/></svg>
                在浏览器中打开
            </button>
            <div class="btn-row">
                <button class="btn" id="btn-start" onclick="handleStart()" disabled>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polygon points="5,3 19,12 5,21"/></svg>
                    启动服务
                </button>
                <button class="btn" id="btn-stop" onclick="handleStop()" disabled>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="6" y="6" width="12" height="12" rx="1"/></svg>
                    停止服务
                </button>
            </div>
            <button class="btn btn-update" id="btn-update" onclick="handleUpdate()">检测更新</button>
        </div>
        <p id="update-status" class="update-status" role="status"></p>

        <section class="log-section" aria-label="日志">
            <h2 class="section-title">日志</h2>
            <div class="log-area" id="log-area"><div>正在初始化…</div></div>
        </section>
    </main>

    <script>
        const FLASK_PORT = 5008;
        const FLASK_URL = `http://127.0.0.1:${FLASK_PORT}`;
        const HEALTH_URL = `${FLASK_URL}/api/health`;
        let healthTimer = null;

        async function handleUpdate() {
            const button = document.getElementById('btn-update');
            const status = document.getElementById('update-status');
            button.disabled = true;
            status.textContent = '正在检测更新…';
            try {
                const version = await window.__TAURI__.core.invoke('check_for_update');
                if (!version) {
                    status.textContent = '已是最新版本';
                    return;
                }
                status.textContent = `发现 ${version}，安装时应用会退出，请先保存浏览器中的编辑内容。`;
                if (!confirm(`安装 ${version}？请先保存浏览器中的编辑内容。安装时应用会退出。`)) return;
                status.textContent = '正在下载并安装更新…';
                await window.__TAURI__.core.invoke('install_update');
                status.textContent = '更新已安装，请重启应用';
            } catch (error) {
                status.textContent = `更新失败：${String(error)}`;
            } finally {
                button.disabled = false;
            }
        }

        function appendLog(text, source = '界面') {
            const area = document.getElementById('log-area');
            const line = document.createElement('div');
            const time = new Date().toLocaleTimeString('zh-CN', { hour12: false });
            line.textContent = source === '服务' ? `[服务] ${text}` : `[${time}] ${text}`;
            area.appendChild(line);
            while (area.children.length > 300) area.firstElementChild.remove();
            area.scrollTop = area.scrollHeight;
        }

        const log = message => appendLog(message);
        let logCursor = 0;
        let syncingLogs = false;
        async function syncStartupLogs() {
            if (!window.__TAURI__ || syncingLogs) return;
            syncingLogs = true;
            try {
                const batch = await window.__TAURI__.core.invoke('get_startup_logs', { cursor: logCursor });
                batch.lines.forEach(line => appendLog(line, '服务'));
                logCursor = batch.next_cursor;
            } catch (error) {
                appendLog(`读取服务日志失败：${String(error)}`);
            } finally {
                syncingLogs = false;
            }
        }
        void syncStartupLogs();
        setInterval(syncStartupLogs, 1000);

        function setStatus(state, label, detail) {
            const dot = document.getElementById('status-dot');
            dot.className = 'status-dot ' + state;
            document.getElementById('status-label').textContent = label;
            if (detail) document.getElementById('status-detail').textContent = detail;
        }

        function setButtonStates(state) {
            // state: 'running' | 'stopped' | 'starting' | 'error'
            const btnOpen = document.getElementById('btn-open');
            const btnStart = document.getElementById('btn-start');
            const btnStop = document.getElementById('btn-stop');
            btnOpen.disabled = state !== 'running';
            btnStart.disabled = state === 'running' || state === 'starting';
            btnStop.disabled = state !== 'running';
        }

        async function checkHealth() {
            try {
                const resp = await fetch(HEALTH_URL, { signal: AbortSignal.timeout(2000) });
                if (resp.ok) {
                    const data = await resp.json();
                    return data.status === 'ok';
                }
            } catch (e) {}
            return false;
        }

        async function pollHealth() {
            if (await checkHealth()) {
                setStatus('running', '服务运行中', '端口 5008 · 就绪');
                setButtonStates('running');
                return true;
            }
            return false;
        }

        async function startPolling() {
            if (healthTimer) clearInterval(healthTimer);
            let count = 0;
            healthTimer = setInterval(async () => {
                if (await pollHealth()) {
                    log('服务已就绪');
                    clearInterval(healthTimer);
                    healthTimer = null;
                    return;
                }
                count++;
                if ([5, 10, 20, 30].includes(count)) log(`健康检查仍未通过（${count} 秒）`);
                if (count > 30) {
                    clearInterval(healthTimer);
                    healthTimer = null;
                    setStatus('error', '启动超时', '请检查日志');
                    setButtonStates('error');
                    log('启动超时，请查看日志');
                }
            }, 1000);
        }

        async function handleOpen() {
            if (window.__TAURI__) {
                try {
                    await window.__TAURI__.core.invoke('open_in_browser');
                } catch (e) { console.error(e); }
            }
        }

        async function handleStart() {
            setStatus('starting', '正在启动...', '端口 5008');
            setButtonStates('starting');
            log('正在启动 Flask 服务...');
            if (!window.__TAURI__) {
                log('Tauri API 不可用');
                return;
            }
            try {
                const result = await window.__TAURI__.core.invoke('start_flask');
                log(result);
            } catch (e) {
                log('启动失败：' + String(e));
                setStatus('error', '启动失败', '');
                setButtonStates('error');
                return;
            }
            startPolling();
        }

        async function handleStop() {
            setButtonStates('starting');
            log('正在停止服务...');
            if (!window.__TAURI__) {
                log('Tauri API 不可用');
                return;
            }
            try {
                const result = await window.__TAURI__.core.invoke('stop_flask');
                log(result);
                setStatus('stopped', '服务已停止', '端口 5008');
                setButtonStates('stopped');
            } catch (e) {
                log('停止失败：' + String(e));
                if (!await checkHealth()) {
                    setStatus('stopped', '服务已停止', '端口 5008');
                    setButtonStates('stopped');
                }
            }
        }


        (async () => {
            if (await pollHealth()) {
                log('服务已就绪');
                return;
            }
            log('启动器已打开，等待服务响应健康检查');
            startPolling();
        })();
    </script>
</body>
</html>
