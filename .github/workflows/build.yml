name: Build desktop apps

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            artifact: Annotate-macOS-ARM64
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            artifact: Annotate-Windows-x64-installer
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: astral-sh/setup-uv@v6
      - name: Install Python 3.10
        run: uv python install 3.10
      - name: Prepare app resources (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python_home="$("$(uv python find 3.10 --managed-python)" -c 'import sys; print(sys.prefix)')"
          python3 scripts/prepare-ci-resources.py --python-home "$python_home"
          uv pip install --python src-tauri/resources/python/bin/python3 --target src-tauri/resources/python/lib/python3.10/site-packages -r requirements.txt
          src-tauri/resources/python/bin/python3 -c 'import flask, PIL, psd_tools, docx, numpy'
      - name: Prepare app resources (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pythonExe = (uv python find 3.10 --managed-python).Trim()
          $pythonHome = & $pythonExe -c 'import sys; print(sys.prefix)'
          python scripts/prepare-ci-resources.py --python-home $pythonHome
          uv pip install --python src-tauri/resources/python/python.exe --target src-tauri/resources/python/Lib/site-packages -r requirements.txt
          src-tauri/resources/python/python.exe -c 'import flask, PIL, psd_tools, docx, numpy'
      - name: Install Tauri CLI
        run: npm install --global "@tauri-apps/cli@^2"
      - name: Check deep drawing tools
        run: node --test tests/deep-tool-continuity.test.js
      - name: Check rich text image storage
        run: node --test tests/rich-image-storage.test.js
      - name: Build macOS ARM64 app
        if: runner.os == 'macOS'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: tauri build --ci --target ${{ matrix.target }} --bundles app
      - name: Package macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: ditto -c -k --sequesterRsrc --keepParent src-tauri/target/${{ matrix.target }}/release/bundle/macos/Annotate.app Annotate-macOS-ARM64.zip
      - name: Collect macOS updater files
        if: runner.os == 'macOS'
        shell: bash
        run: |
          cp src-tauri/target/${{ matrix.target }}/release/bundle/macos/Annotate.app.tar.gz Annotate-macOS-ARM64.app.tar.gz
          cp src-tauri/target/${{ matrix.target }}/release/bundle/macos/Annotate.app.tar.gz.sig Annotate-macOS-ARM64.app.tar.gz.sig
      - name: Build Windows x64 app
        if: runner.os == 'Windows'
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: tauri build --ci --target ${{ matrix.target }} --bundles nsis
      - name: Collect Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer is missing' }
          if (-not (Test-Path "$($installer.FullName).sig")) { throw 'Updater signature is missing' }
          Copy-Item $installer.FullName 'Annotate-Windows-x64-setup.exe'
          Copy-Item "$($installer.FullName).sig" 'Annotate-Windows-x64-setup.exe.sig'
      - name: Upload macOS app
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            Annotate-macOS-ARM64.zip
            Annotate-macOS-ARM64.app.tar.gz
            Annotate-macOS-ARM64.app.tar.gz.sig
          if-no-files-found: error
      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            Annotate-Windows-x64-setup.exe
            Annotate-Windows-x64-setup.exe.sig
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download desktop builds
        uses: actions/download-artifact@v4
        with:
          pattern: Annotate-*
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/create-update-manifest.py dist "$GH_REPO" "$RELEASE_TAG"
          gh release create "$RELEASE_TAG" dist/* --title "Annotate $RELEASE_TAG" --generate-notes --verify-tag
