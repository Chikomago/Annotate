name: Build desktop apps

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            artifact: Annotate-macOS-ARM64
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            artifact: Annotate-Windows-x64-portable
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: astral-sh/setup-uv@v6
      - name: Install Python 3.10
        run: uv python install 3.10
      - name: Prepare app resources (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python_home="$("$(uv python find 3.10 --managed-python)" -c 'import sys; print(sys.prefix)')"
          python3 scripts/prepare-ci-resources.py --python-home "$python_home"
          uv pip install --python src-tauri/resources/python/bin/python3 --target src-tauri/resources/python/lib/python3.10/site-packages -r requirements.txt
          src-tauri/resources/python/bin/python3 -c 'import flask, PIL, psd_tools, docx, numpy'
      - name: Prepare app resources (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pythonExe = (uv python find 3.10 --managed-python).Trim()
          $pythonHome = & $pythonExe -c 'import sys; print(sys.prefix)'
          python scripts/prepare-ci-resources.py --python-home $pythonHome
          uv pip install --python src-tauri/resources/python/python.exe --target src-tauri/resources/python/Lib/site-packages -r requirements.txt
          src-tauri/resources/python/python.exe -c 'import flask, PIL, psd_tools, docx, numpy'
      - name: Install Tauri CLI
        run: npm install --global "@tauri-apps/cli@^2"
      - name: Check deep drawing tools
        run: node --test tests/deep-tool-continuity.test.js
      - name: Check rich text image storage
        run: node --test tests/rich-image-storage.test.js
      - name: Build macOS ARM64 app
        if: runner.os == 'macOS'
        run: tauri build --ci --target ${{ matrix.target }} --bundles app
      - name: Package macOS app
        if: runner.os == 'macOS'
        shell: bash
        run: ditto -c -k --sequesterRsrc --keepParent src-tauri/target/${{ matrix.target }}/release/bundle/macos/Annotate.app Annotate-macOS-ARM64.zip
      - name: Build Windows x64 app
        if: runner.os == 'Windows'
        run: tauri build --ci --target ${{ matrix.target }} --no-bundle
      - name: Package Windows portable app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $portable = 'Annotate-Windows-x64-portable'
          $release = 'src-tauri/target/${{ matrix.target }}/release'
          New-Item -ItemType Directory -Path "$portable/resources" -Force | Out-Null
          Copy-Item "$release/Annotate.exe" "$portable/Annotate.exe"
          Copy-Item 'src-tauri/resources/python' "$portable/resources/python" -Recurse
          Copy-Item 'src-tauri/resources/app' "$portable/resources/app" -Recurse
          if (-not (Test-Path "$portable/resources/python/python.exe")) { throw 'Bundled Python is missing' }
          if (-not (Test-Path "$portable/resources/app/app.py")) { throw 'Bundled app.py is missing' }
          & "$portable/resources/python/python.exe" -c 'import flask, PIL, psd_tools, docx, numpy'
          if ($LASTEXITCODE -ne 0) { throw 'Bundled Python dependencies cannot be imported' }
          Compress-Archive -Path $portable -DestinationPath "$portable.zip" -Force
      - name: Upload macOS app
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: Annotate-macOS-ARM64.zip
          if-no-files-found: error
      - name: Upload Windows portable app
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: Annotate-Windows-x64-portable.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download desktop builds
        uses: actions/download-artifact@v4
        with:
          pattern: Annotate-*
          path: dist
          merge-multiple: true
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/*.zip --title "Annotate $RELEASE_TAG" --generate-notes --verify-tag
